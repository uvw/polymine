name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks on the tagged commit before it builds.
  workflow_call:
    inputs:
      ref:
        description: The commit to check, when it isn't the one that triggered the run.
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

# A pull request's pushes share a group, so a newer push cancels the older run.
# Every other run gets a group of its own: GitHub drops a pending run when a
# newer one joins its group, even without cancel-in-progress, so a shared group
# would leave some commits on main without a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/check-versions.mjs
      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:md
      # The release notes are Markdown, checked with these same tools.
      - name: The release notes scripts pass their tests
        run: bash .github/workflows/hack/release-notes.sh test
      - run: npm run check
      - run: npm run coverage
      - run: npm run build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      # Installs the toolchain and components rust-toolchain.toml pins.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The app crate embeds the built UI at compile time.
      - run: npm ci && npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: CLI smoke test against a running app
        run: cargo build -p polymine -p polymine-cli --locked && node scripts/cli-smoke.mjs
      - name: TypeScript bindings are up to date
        if: success() || failure()
        shell: bash
        run: git diff --exit-code -- ui/src/lib/bindings

  notices:
    name: Third-party notices
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The same cargo-about version as the committed file, checked against the
      # release's published SHA-256.
      - name: Install cargo-about
        env:
          VERSION: 0.8.4
          SHA256: c7381aa0cdc41fc0ee662cec8daa260da7817ad8ddea04cd4ddad425460adf14
        run: |
          name="cargo-about-$VERSION-x86_64-unknown-linux-musl"
          curl -fsSL -o cargo-about.tar.gz \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/$VERSION/$name.tar.gz"
          echo "$SHA256  cargo-about.tar.gz" | sha256sum -c -
          tar -xzf cargo-about.tar.gz --strip-components=1 -C "$HOME/.cargo/bin" "$name/cargo-about"
          rm cargo-about.tar.gz
      - run: cargo fetch --locked
      - run: npm run notices
      - name: Third-party notices are up to date
        run: git diff --exit-code -- ui/src/lib/notices

  licenses:
    name: Dependency licenses and advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check

  # zizmor and gitleaks fail this workflow on a finding. The weekly Security
  # workflow also runs zizmor's online audits and sends findings to code
  # scanning.
  zizmor:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Pinned, so a new zizmor release can't turn this job red on its own.
          version: 1.32.0
          # Plain output, with a failing exit code on a finding. The SARIF mode
          # exits 0 and needs a token that can write to code scanning.
          advanced-security: false
          # Offline, so a new advisory against a pinned action can't turn a
          # pull request or a release red on its own.
          online-audits: false

  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          # The whole history, not only the newest commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks, checked against its published hash
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan the history
        run: gitleaks git --redact .

  # Commits on main follow Conventional Commits (CONTRIBUTING.md), and a pull
  # request's title becomes its commit when it's squash-merged.
  pr-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
          # The pull request's author, not github.actor, who may be anyone that
          # reran the checks.
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          pattern='^(feat|fix|docs|test|refactor|ci|chore)(\([a-z0-9-]+\))?!?: [a-z].*[^.]$'
          [[ "$TITLE" =~ $pattern ]] && exit 0
          # Dependabot writes "Bump" with a capital, and has no setting to change it.
          dependabot='^(fix|chore|ci)\(deps(-dev)?\): Bump '
          [[ "$AUTHOR" == "dependabot[bot]" && "$TITLE" =~ $dependabot ]] && exit 0
          echo "::error::Use type(scope): lowercase imperative subject, such as fix(ui): keep menus inside the window"
          exit 1

  # The one check to require. A skipped or cancelled job would otherwise count
  # as passing; only the title check may be skipped, outside pull requests.
  all-green:
    name: CI (all green)
    if: always()
    needs: [web, rust, notices, licenses, zizmor, gitleaks, pr-title]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success"
            or (.key == "pr-title" and .value.result == "skipped"))'
