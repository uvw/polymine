name: Release

# release-please calls this once its release pull request merges and the draft
# release and tag exist. Running it by hand (re)publishes an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        description: The tag to release, such as v0.1.0.
        required: true
        type: string
    # Optional: without it, winget is skipped. A secret of the release
    # environment takes the place of the one passed here.
    secrets:
      WINGET_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to release, such as v0.1.0.
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  eligibility:
    name: Release eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    # Later jobs check out this commit, not the tag, so a tag moved mid-run
    # can't slip an unchecked commit into the build.
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: The tag is a version on main, and every version file agrees
        id: check
        env:
          TAG: ${{ inputs.tag }}
        # Prereleases are refused: publish marks the release as latest.
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "::error::$TAG is not a vMAJOR.MINOR.PATCH tag"; exit 1; }
          git merge-base --is-ancestor "refs/tags/$TAG" origin/main ||
            { echo "::error::$TAG is not on main"; exit 1; }
          node hack/check-versions.mjs "$TAG"
          echo "sha=$(git rev-parse "refs/tags/$TAG^{commit}")" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: eligibility
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ needs.eligibility.outputs.sha }}
    permissions:
      contents: read

  # Builds the installers, the updater archives, and the portable ZIP but
  # publishes nothing. This job holds no token that can write or sign.
  build:
    name: Build (${{ matrix.name }})
    needs: [eligibility, ci]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            os: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
            # The app bundle is what the updater installs on macOS.
            bundles: app,dmg
          - name: macOS Intel
            os: macos-15
            target: x86_64-apple-darwin
            arch: x64
            bundles: app,dmg
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            arch: x64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.eligibility.outputs.sha }}
          persist-credentials: false
      # Installs the toolchain rust-toolchain.toml pins, plus the build target.
      - run: rustup toolchain install --target ${{ matrix.target }}
      # No Rust or npm cache: releases build from scratch, so nothing a pull
      # request wrote to a cache reaches a published build.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      # Tauri bundles polymine-cli beside the app as a sidecar, which it finds
      # by the target triple in the file name.
      - name: Build polymine-cli for the bundle
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --release --locked -p polymine-cli --target "$TARGET"
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          mkdir -p src-tauri/binaries
          cp "target/$TARGET/release/polymine-cli$ext" \
            "src-tauri/binaries/polymine-cli-$TARGET$ext"
      # The Tauri CLI runs `npm run build` itself through `beforeBuildCommand`.
      # It writes the updater artifacts only when it can sign them, so it signs
      # with a key made for this run and thrown away. The sign job replaces
      # each signature with one from the release key, which no build job holds.
      - name: Build and bundle the app
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          BUNDLES: ${{ matrix.bundles }}
          # No certificates exist yet. The `-` identity ad-hoc signs the macOS
          # bundle: Apple silicon refuses to launch a downloaded app with no
          # signature at all, and calls it damaged instead of offering Open.
          # Windows ignores it.
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          export TAURI_SIGNING_PRIVATE_KEY=$RUNNER_TEMP/throwaway.key TAURI_SIGNING_PRIVATE_KEY_PASSWORD=
          npx tauri signer generate --ci -p "" -w "$TAURI_SIGNING_PRIVATE_KEY" >/dev/null
          npx tauri build --target "$TARGET" --bundles "$BUNDLES" \
            --config src-tauri/tauri.bundle-cli.conf.json \
            --config src-tauri/tauri.updater.conf.json -- --locked
          rm "$TAURI_SIGNING_PRIVATE_KEY" "$TAURI_SIGNING_PRIVATE_KEY.pub"
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          bundle=target/$TARGET/release/bundle
          mkdir -p dist
          if [ "$RUNNER_OS" = macOS ]; then
            cp "$bundle"/dmg/Polymine_*.dmg dist/
            cp "$bundle/macos/Polymine.app.tar.gz" "dist/Polymine_${version}_${ARCH}.app.tar.gz"
          else
            cp "$bundle"/nsis/Polymine_*-setup.exe dist/
          fi
      # A portable copy: no installer, and the `portable` marker keeps its data
      # in a `data` folder beside the executable.
      - name: Make the portable Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $release = "target/$env:TARGET/release"
          $stage = New-Item -ItemType Directory -Path "portable/Polymine"
          Copy-Item "$release/polymine.exe" "$stage/Polymine.exe"
          Copy-Item "$release/polymine-cli.exe" "$stage/polymine-cli.exe"
          Set-Content "$stage/portable" "Polymine keeps its settings, games and logs in the data folder here."
          Compress-Archive -Path $stage -DestinationPath "dist/Polymine_${version}_x64_portable.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Signs each updater artifact with the release key and writes latest.json,
  # the manifest installed copies read. The key reaches only this job, which
  # builds nothing, runs no install scripts, and can't write to the repository.
  sign:
    name: Sign updates
    needs: [eligibility, build]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.eligibility.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # For the Tauri CLI, whose native binary needs no install script.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      # The version goes into each signature, and the app refuses an update
      # whose manifest names another.
      - name: Sign the updater artifacts
        env:
          TAG: ${{ inputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key has no password, and GitHub refuses an empty secret.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          [[ -n $TAURI_SIGNING_PRIVATE_KEY ]] ||
            { echo "::error::the release environment has no TAURI_SIGNING_PRIVATE_KEY (hack/release-tokens.sh)"; exit 1; }
          bash .github/workflows/hack/updater-manifest.sh files dist "${TAG#v}" >"$RUNNER_TEMP/updater-files"
          while read -r file; do
            npx tauri signer sign --app-version "${TAG#v}" "$file" >/dev/null
          done <"$RUNNER_TEMP/updater-files"
      # The release notes go in when they pass the check the release page
      # uses; the app itself shows the version and a link to the page.
      - name: Write latest.json
        env:
          TAG: ${{ inputs.tag }}
        run: |
          notes=docs/release-notes/$TAG.md
          if [[ ! -f $notes ]] || ! bash .github/workflows/hack/release-notes.sh verify "$notes"; then
            notes=
          fi
          mkdir -p updater
          bash .github/workflows/hack/updater-manifest.sh manifest dist "$TAG" "$notes" >updater/latest.json
          cp dist/*.sig updater/
          cat updater/latest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater
          path: updater/*
          if-no-files-found: error

  attest:
    name: Attest provenance
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: updater
          path: dist
      - name: List every file's SHA-256 in checksums.txt
        working-directory: dist
        run: sha256sum Polymine_* latest.json > checksums.txt && cat checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: dist/checksums.txt
          if-no-files-found: error

  # Runs last, so a release is only ever published complete, with every asset
  # already attested. The release environment admits only main and v* tags
  # (docs/releasing.md), so a dispatch from another branch can't publish.
  publish:
    name: Publish
    needs: [eligibility, attest]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # For the release notes, the script that checks them, and the downloads
      # section.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.eligibility.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: updater
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: dist
      - name: Upload the assets to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
      # Copilot wrote the notes in the release pull request (release-please.yml).
      # Without them, or when they fail their check, the release keeps
      # release-please's list alone, so the notes never hold up a release.
      - name: Put the release notes above the changelog list
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          notes=docs/release-notes/$TAG.md
          if [[ ! -f $notes ]]; then
            echo "No $notes, so the release keeps the changelog list alone"
            exit 0
          fi
          gh release view "$TAG" --json body -q .body >"$RUNNER_TEMP/current.md"
          if bash .github/workflows/hack/release-notes.sh body "$notes" "$RUNNER_TEMP/current.md" >"$RUNNER_TEMP/notes-body.md"; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes-body.md"
          else
            echo "::warning::$notes failed its check, so the release keeps the changelog list alone"
          fi
      # release-please wrote the changelog into the draft. The downloads and
      # first-launch steps go below it, and below the notes, once.
      - name: Add the downloads to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          body=$(gh release view "$TAG" --json body -q .body)
          if [[ $body != *"## Downloads"* ]]; then
            { printf '%s\n\n' "$body"; sed "s/VERSION/${TAG#v}/g" .github/release-body.md; } >"$RUNNER_TEMP/body.md"
            gh release edit "$TAG" --title "Polymine $TAG" --notes-file "$RUNNER_TEMP/body.md"
          fi
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ needs.eligibility.outputs.sha }}
        # A release belongs to the tag's name, so the tag must still name the
        # commit every job built and tested.
        run: |
          tagged=$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha)
          [[ $tagged == "$SHA" ]] ||
            { echo "::error::$TAG moved to $tagged after the build of $SHA"; exit 1; }
          gh release edit "$TAG" --draft=false --latest

  # The package managers point at the published release, so they come after it.
  homebrew:
    name: Homebrew tap
    needs: [eligibility, publish]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.eligibility.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: dist
      - name: Push the cask to uvw/homebrew-tap
        env:
          TAG: ${{ inputs.tag }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bash .github/workflows/hack/homebrew.sh "$TAG" dist/checksums.txt

  winget:
    name: winget
    needs: [eligibility, publish]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.eligibility.outputs.sha }}
          persist-credentials: false
      - name: Open the winget-pkgs pull request
        env:
          TAG: ${{ inputs.tag }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: bash .github/workflows/hack/winget.sh "$TAG"
