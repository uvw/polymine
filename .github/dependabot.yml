version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # A week for a bad release to be noticed and yanked before it's proposed.
    # Security updates aren't delayed.
    cooldown:
      default-days: 7
    # A crate changes the shipped app, so its update is a fix that makes a
    # release.
    commit-message:
      prefix: fix
      include: scope
    # A dependency joins the first group that matches it, so the narrow groups
    # come first and each gets a pull request of its own.
    groups:
      # A rand update can move every seeded mine layout (AGENTS.md).
      rand:
        patterns: ["rand", "rand_*"]
      # Pinned to exact versions; a new one can change the generated bindings.
      specta:
        patterns: ["specta", "specta-*", "tauri-specta"]
      # Must keep the npm @tauri-apps packages' major and minor version, which
      # scripts/check-versions.mjs checks.
      tauri:
        patterns: ["tauri", "tauri-*"]
        exclude-patterns: ["tauri-specta"]
      cargo:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # The runtime packages ship, so their updates are fixes. The dev packages
    # are mostly tools; svelte and vite shape the build too, but their updates
    # can wait for the next release.
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    ignore:
      # svelte-check supports TypeScript up to 6.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      npm:
        patterns: ["*"]
  # Copilot CLI, which writes the release notes (docs/releasing.md). It never
  # reaches the app, so its updates make no release.
  - package-ecosystem: npm
    directory: /.github/release-notes
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      release-notes:
        patterns: ["*"]
  # The workflows' actions never reach the app, so their updates make no
  # release. The prefix holds the deps scope itself, so titles start ci(deps):.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]
