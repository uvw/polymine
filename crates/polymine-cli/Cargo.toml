[package]
name = "polymine-cli"
description = "Plays Polymine from a terminal: drives a running instance, or headless games of its own."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
polymine-core.workspace = true
polymine-ipc.workspace = true
polymine-net.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
polymine-net = { workspace = true, features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
