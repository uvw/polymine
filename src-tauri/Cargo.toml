[package]
name = "polymine"
description = "Polymine desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# The lib split lets the same code back future mobile builds.
name = "polymine_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
polymine-core.workspace = true
polymine-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rand.workspace = true
specta.workspace = true
specta-typescript = "=0.0.13"
# Transparent webviews on macOS need private AppKit API, which rules out the
# Mac App Store (not a target). The feature does nothing on other platforms.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
# Without `zip`, which only reads the updater bundles of Tauri 1.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
log = "0.4"
window-vibrancy = "0.8"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["UI_ViewManagement", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSButton", "NSColor", "NSColorSpace", "NSControl", "NSImage", "NSResponder", "NSToolbar", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSGeometry"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
