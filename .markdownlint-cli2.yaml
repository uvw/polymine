# The files markdownlint-cli2 lints, so `npm run lint:md`, CI, and editors all
# run it with no arguments. The rules are in .markdownlint.yaml.
globs:
  - "**/*.md"

# Add a path only when the Markdown there is vendored, generated, or local, and
# say which.
ignores:
  # Installed packages and build output: vendored and generated.
  - node_modules
  - target
  # Vendored license text, copied verbatim into the third-party notices.
  - scripts/notices
  # Copilot CLI's npm packages, for the release notes: vendored.
  - .github/release-notes/node_modules
  # Agent worktrees: copies of this checkout.
  - .claude/worktrees
  # Local-only docs, never committed.
  - docs/local
